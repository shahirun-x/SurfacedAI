<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background -->
  <rect width="32" height="32" rx="6" fill="#0A0F1A"/>
  <!-- Horizontal base line -->
  <line x1="8" y1="22" x2="24" y2="22" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <!-- Vertical rise from center -->
  <line x1="16" y1="22" x2="16" y2="12" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
  <!-- Dot at top — the surfaced point -->
  <circle cx="16" cy="9" r="3" fill="#2DD4BF"/>
</svg>
